[project]
name = "meeting-mirror"
version = "0.1.0"
description = "Evidence-first personal meeting coaching with three agents"
requires-python = ">=3.11,<3.15"
dependencies = [
  "agent-framework-github-copilot==1.0.3",
  "azure-cognitiveservices-speech==1.45.0",
  "fastapi==0.116.1",
  "pydantic==2.11.7",
  "pypdf==5.9.0",
  "python-docx==1.2.0",
  "python-multipart==0.0.20",
  "tzdata==2025.2",
  "uvicorn[standard]==0.35.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "reportlab==4.4.3",
  "ruff==0.12.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
